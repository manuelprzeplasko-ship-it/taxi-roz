<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Rozliczenie kierowcy – PIKER TAXI</title>
<style>
body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 0;
    margin: 0;
}
.page {
    width: 210mm;
    min-height: 297mm;
    padding: 20mm;
    margin: auto;
    background: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}
input {
    width: 100%;
    padding: 8px;
    margin: 4px 0 12px 0;
    font-size: 16px;
    box-sizing: border-box;
}
input[readonly], input.auto-field {
    background-color: #fff;
    color: #000;
    font-weight: normal;
    opacity: 1;
}
.date-range {
    display: flex;
    gap: 12px;
}
.date-range > div {
    flex: 1;
}
label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
}
h2 {
    text-align: center;
    margin-bottom: 20px;
}
button {
    width: 100%;
    padding: 14px;
    background: #f1c40f;
    color: #000;
    font-weight: bold;
    border-radius: 6px;
    font-size: 18px;
    margin-top: 12px;
    border: none;
}
.result {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
}
.calculation-detail {
    font-size: 14px;
    font-weight: normal;
    margin-top: 4px;
    line-height: 1.35;
}
.top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.history {
    margin-top: 28px;
    border-top: 2px solid #ddd;
    padding-top: 18px;
}
.history h2 { margin-bottom: 12px; }
.history-item {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    margin: 8px 0;
    background: #fafafa;
}
.history-item strong { display: block; margin-bottom: 4px; }
.history-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}
.history-actions button {
    width: auto;
    flex: 1;
    padding: 8px;
    margin-top: 0;
    font-size: 14px;
}

@media print {
    @page { size: A4 portrait; margin: 7mm; }
    body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .page {
        width: auto;
        min-height: auto;
        padding: 0;
        margin: 0;
        box-shadow: none;
    }
    .page > div:first-child { margin-bottom: 8px !important; }
    .page > div:first-child img { width: 120px !important; margin-bottom: 3px !important; }
    .page > div:first-child div { font-size: 18px !important; }
    .top { margin-bottom: 6px; }
    h2 { margin: 5px 0 7px; font-size: 18px; }
    h3 { margin: 7px 0 2px; font-size: 15px; }
    label { margin-top: 3px; font-size: 11px; }
    input { padding: 3px; margin: 1px 0 3px 0; font-size: 12px; box-sizing: border-box; }
    .result { font-size: 14px; margin-top: 2px; }
    .calculation-detail { font-size: 10px; margin-top: 1px; line-height: 1.2; }
    button, .history { display: none !important; }
}

</style>
</head>
<body>

<div class="page">

<!-- LOGO PIKER TAXI -->
<div style="text-align:center; margin-bottom:25px;">
    <img src="piker.jpg" alt="PIKER TAXI" style="width:180px; margin-bottom:10px;">
    <div style="font-size:26px; font-weight:bold; color:#000;">PIKER TAXI</div>
</div>

<div class="top">
    <div>
        <label>Imię i nazwisko kierowcy:</label>
        <input id="name" type="text">
    </div>
    <div>
        <label>DATY:</label>
        <div class="date-range">
            <div>
                <label>Od:</label>
                <input id="dateFrom" type="date">
            </div>
            <div>
                <label>Do:</label>
                <input id="dateTo" type="date">
            </div>
        </div>
    </div>
</div>

<h2>Rozliczenie kierowcy</h2>

<label>CAŁOŚĆ BOLT</label>
<input id="bolt" type="number" placeholder="Kwota z aplikacji">
<label>POŁOWA BOLT</label>
<input id="halfBolt" class="auto-field" type="number" readonly>

<label>GOTÓWKA</label>
<input id="cash" type="number">

<label>KARTA</label>
<input id="card" type="number">
<label>POŁOWA Z KARTY</label>
<input id="halfCard" class="auto-field" type="number" readonly>

<label>NAPIWKI</label>
<input id="tips" type="number">

<label>PALIWO</label>
<input id="fuel" type="number">
<label>POŁOWA PALIWA</label>
<input id="halfFuel" class="auto-field" type="number" readonly>

<label>POZA APK</label>
<input id="outside" type="number">
<label>POŁOWA POZA APK</label>
<input id="halfOutside" class="auto-field" type="number" readonly>

<label>ZUS / PODATKI</label>
<input id="tax" type="number" value="65">

<h3>ZAROBEK KIEROWCY</h3>
<div class="result" id="income"></div>
<div class="calculation-detail" id="incomeDetail"></div>

<h3>OBLICZANIE GOTÓWKI</h3>
<div class="result" id="cashCalc"></div>
<div class="calculation-detail" id="cashCalcDetail"></div>

<h3>PODSUMOWANIE</h3>
<div class="result" id="summary"></div>
<div class="result" id="status"></div>

<button onclick="calculate()">OBLICZ</button>
<button onclick="saveSettlement()">ZAPISZ</button>
<button onclick="clearAll()">WYCZYŚĆ WSZYSTKO</button>
<button onclick="window.print()">DRUKUJ</button>

<div class="history">
    <h2>HISTORIA ROZLICZEŃ</h2>
    <div id="historyList"></div>
</div>

</div>

<script>
function calculate() {
    let bolt = Number(document.getElementById("bolt").value);
    let cash = Number(document.getElementById("cash").value);
    let card = Number(document.getElementById("card").value);
    let tips = Number(document.getElementById("tips").value);
    let fuel = Number(document.getElementById("fuel").value);
    let outside = Number(document.getElementById("outside").value);
    let tax = Number(document.getElementById("tax").value);

    let halfBolt = bolt / 2;
    let halfCard = card / 2;
    let halfFuel = fuel / 2;
    let halfOutside = outside / 2;

    document.getElementById("halfBolt").value = halfBolt.toFixed(2);
    document.getElementById("halfCard").value = halfCard.toFixed(2);
    document.getElementById("halfFuel").value = halfFuel.toFixed(2);
    document.getElementById("halfOutside").value = halfOutside.toFixed(2);

    let income = halfBolt + tips + halfCard + halfOutside - halfFuel - tax;
    document.getElementById("income").innerHTML = income.toFixed(2) + " zł";
    document.getElementById("incomeDetail").textContent =
        halfBolt.toFixed(2) + " + " + tips.toFixed(2) + " + " + halfCard.toFixed(2) + " + " +
        halfOutside.toFixed(2) + " - " + halfFuel.toFixed(2) + " - " + tax.toFixed(2) +
        " = " + income.toFixed(2) + " zł";

    let cashCalc = cash + outside - fuel;
    document.getElementById("cashCalc").innerHTML = cashCalc.toFixed(2) + " zł";
    document.getElementById("cashCalcDetail").textContent =
        cash.toFixed(2) + " + " + outside.toFixed(2) + " - " + fuel.toFixed(2) +
        " = " + cashCalc.toFixed(2) + " zł";

    let summary = cashCalc - income;
    document.getElementById("summary").innerHTML = summary.toFixed(2) + " zł";

    let status = summary < 0 ? "DLA KIEROWCY" : "DLA PIKER";
    document.getElementById("status").innerHTML = status;
}

function clearAll() {
    const fields = [
        "bolt", "halfBolt",
        "cash", "card", "halfCard", "tips",
        "fuel", "halfFuel",
        "outside", "halfOutside",
        "tax",
        "income", "incomeDetail", "cashCalc", "cashCalcDetail",
        "summary", "status",
        "name", "dateFrom", "dateTo"
    ];

    fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            if (el.tagName === "INPUT") {
                el.value = "";
            } else {
                el.innerHTML = "";
            }
        }
    });
}

const STORAGE_KEY = "pikerTaxiSettlements";

function getSettlements() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
        return [];
    }
}

function readSettlementFromForm() {
    calculate();
    return {
        id: Date.now(),
        name: document.getElementById("name").value.trim(),
        dateFrom: document.getElementById("dateFrom").value,
        dateTo: document.getElementById("dateTo").value,
        bolt: document.getElementById("bolt").value,
        cash: document.getElementById("cash").value,
        card: document.getElementById("card").value,
        tips: document.getElementById("tips").value,
        fuel: document.getElementById("fuel").value,
        outside: document.getElementById("outside").value,
        tax: document.getElementById("tax").value,
        savedAt: new Date().toISOString()
    };
}

function saveSettlement() {
    const item = readSettlementFromForm();
    if (!item.name) {
        alert("Wpisz imię i nazwisko kierowcy.");
        return;
    }
    if (!item.dateFrom || !item.dateTo) {
        alert("Podaj zakres dat: Od i Do.");
        return;
    }
    const items = getSettlements();
    items.unshift(item);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    renderHistory();
    alert("Rozliczenie zostało zapisane.");
}

function fillSettlement(item) {
    ["name","dateFrom","dateTo","bolt","cash","card","tips","fuel","outside","tax"].forEach(id => {
        document.getElementById(id).value = item[id] ?? "";
    });
    calculate();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function openSettlement(id) {
    const item = getSettlements().find(x => x.id === id);
    if (item) fillSettlement(item);
}

function printSettlement(id) {
    const item = getSettlements().find(x => x.id === id);
    if (!item) return;
    fillSettlement(item);
    setTimeout(() => window.print(), 100);
}

function deleteSettlement(id) {
    if (!confirm("Usunąć to rozliczenie z historii?")) return;
    const items = getSettlements().filter(x => x.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    renderHistory();
}

function escapeHtml(text) {
    return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function renderHistory() {
    const list = document.getElementById("historyList");
    const items = getSettlements();
    if (!items.length) {
        list.innerHTML = "<div>Brak zapisanych rozliczeń.</div>";
        return;
    }
    list.innerHTML = items.map(item => `
        <div class="history-item">
            <strong>${escapeHtml(item.name || "Bez nazwy")}</strong>
            <div>${escapeHtml(item.dateFrom || "—")} – ${escapeHtml(item.dateTo || "—")}</div>
            <div class="history-actions">
                <button onclick="openSettlement(${item.id})">OTWÓRZ</button>
                <button onclick="printSettlement(${item.id})">PDF / DRUKUJ</button>
                <button onclick="deleteSettlement(${item.id})">USUŃ</button>
            </div>
        </div>
    `).join("");
}

document.addEventListener("DOMContentLoaded", renderHistory);

</script>

</body>
</html>
